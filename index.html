<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2a6b4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pedido Mel">
<title>Pedido Melamina</title>

<!-- PWA manifest inline via blob — se activa al cargar -->
<script>
const MANIFEST = {
  name: "Pedido Melamina de Cajones",
  short_name: "Pedido Mel",
  description: "Genera pedidos de melamina para cajones",
  start_url: ".",
  display: "standalone",
  background_color: "#f7f7f5",
  theme_color: "#2a6b4a",
  orientation: "portrait",
  icons: [
    { src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='28' fill='%232a6b4a'/%3E%3Ctext x='96' y='130' font-size='100' text-anchor='middle' fill='white'%3E📦%3C/text%3E%3C/svg%3E", sizes: "192x192", type: "image/svg+xml" },
    { src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='80' fill='%232a6b4a'/%3E%3Ctext x='256' y='360' font-size='280' text-anchor='middle' fill='white'%3E📦%3C/text%3E%3C/svg%3E", sizes: "512x512", type: "image/svg+xml" }
  ]
};
const mblob = new Blob([JSON.stringify(MANIFEST)], {type:'application/json'});
const murl = URL.createObjectURL(mblob);
const ml = document.createElement('link');
ml.rel = 'manifest'; ml.href = murl;
document.head.appendChild(ml);
</script>

<style>
:root {
  --bg: #f4f4f1;
  --surface: #ffffff;
  --surface2: #efefec;
  --border: #deddd7;
  --fg: #1a1a18;
  --fg2: #56564f;
  --fg3: #9a9a90;
  --accent: #2a6b4a;
  --accent-d: #205638;
  --accent-light: #e5f2eb;
  --accent-fg: #ffffff;
  --danger: #c0392b;
  --cc: #1a4a7a;
  --cc-light: #e5eef8;
  --c: #7a3a1a;
  --c-light: #f8ece5;
  --r: 14px;
  --rs: 10px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--fg);
  min-height: 100%;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ── Header ── */
.app-bar {
  position: sticky;
  top: 0;
  z-index: 20;
  padding-top: var(--safe-top);
  background: var(--accent);
  color: #fff;
}
.app-bar-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
}
.app-bar h1 { font-size: 15px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.step-badge { font-size: 12px; opacity: .75; font-variant-numeric: tabular-nums; }
.progress { height: 3px; background: rgba(255,255,255,.25); }
.progress-bar { height: 100%; background: rgba(255,255,255,.85); transition: width .3s; }

/* ── Main ── */
.main { padding: 20px 16px calc(20px + var(--safe-bottom)); max-width: 500px; margin: 0 auto; }

/* ── Steps ── */
.step { display: none; }
.step.active { display: block; }
.step-title { font-size: 21px; font-weight: 700; margin-bottom: 4px; }
.step-sub { font-size: 14px; color: var(--fg2); margin-bottom: 22px; }

/* ── Fields ── */
.field { margin-bottom: 18px; }
.lbl {
  display: block;
  font-size: 11px;
  font-weight: 700;
  color: var(--fg3);
  text-transform: uppercase;
  letter-spacing: .07em;
  margin-bottom: 7px;
}
input[type=text], input[type=number] {
  width: 100%;
  padding: 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--rs);
  background: var(--surface);
  color: var(--fg);
  font-family: inherit;
  font-size: 16px;
  outline: none;
  transition: border-color .15s;
  -webkit-appearance: none;
}
input[type=number] { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
input:focus { border-color: var(--accent); }

/* ── Selector buttons ── */
.btn-grid { display: grid; gap: 10px; }
.btn-grid-3 { grid-template-columns: 1fr 1fr 1fr; }
.sel-btn {
  padding: 15px 10px;
  border: 2px solid var(--border);
  border-radius: var(--rs);
  background: var(--surface);
  color: var(--fg);
  font-family: inherit;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  transition: all .15s;
  line-height: 1.2;
}
.sel-btn .sub { display: block; font-size: 10px; font-weight: 500; color: var(--fg3); margin-top: 2px; text-transform: uppercase; letter-spacing: .05em; }
.sel-btn.active { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }
.sel-btn.active .sub { color: var(--accent); opacity: .7; }

/* Color buttons — texto más pequeño */
.color-btn { font-size: 13px; padding: 14px 8px; }

/* ── Error msg ── */
.err { font-size: 13px; color: var(--danger); margin-top: 5px; display: none; }
.err.on { display: block; }

/* ── Casco card ── */
.casco-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  padding: 14px;
  margin-bottom: 10px;
}
.casco-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.casco-num { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--fg3); }
.btn-rm { background: none; border: none; color: var(--danger); font-size: 18px; cursor: pointer; padding: 2px 6px; line-height: 1; }
.casco-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.casco-row .lbl { margin-bottom: 5px; }
.badge { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .07em; padding: 2px 7px; border-radius: 20px; }
.badge-cc { background: var(--cc-light); color: var(--cc); }
.badge-c  { background: var(--c-light);  color: var(--c);  }

/* ── Buttons ── */
.btn-add {
  width: 100%;
  padding: 14px;
  border: 2px dashed var(--border);
  border-radius: var(--r);
  background: transparent;
  color: var(--accent);
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 20px;
  transition: all .15s;
}
.btn-add:active { background: var(--accent-light); border-color: var(--accent); }

.btn-primary {
  width: 100%; padding: 16px;
  background: var(--accent); color: #fff;
  border: none; border-radius: var(--r);
  font-family: inherit; font-size: 16px; font-weight: 700;
  cursor: pointer; transition: background .15s;
}
.btn-primary:active { background: var(--accent-d); }

.btn-sec {
  width: 100%; padding: 14px; margin-top: 10px;
  background: transparent; color: var(--fg2);
  border: 1.5px solid var(--border); border-radius: var(--r);
  font-family: inherit; font-size: 15px; font-weight: 500;
  cursor: pointer; transition: background .15s;
}
.btn-sec:active { background: var(--surface2); }
.btn-danger-out { color: var(--danger); border-color: var(--danger); }

/* ── Result ── */
.pedido-meta {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
  margin-bottom: 16px;
}
.meta-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}
.meta-row:last-child { border-bottom: none; }
.meta-lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--fg3); }
.meta-val { font-size: 15px; font-weight: 600; }

.tbl-section { margin-bottom: 16px; }
.tbl-title {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em;
  padding: 7px 12px;
  border-radius: var(--rs) var(--rs) 0 0;
  border: 1.5px solid var(--border); border-bottom: none;
}
.tbl-title.fondo { color: var(--accent); background: var(--accent-light); }
.tbl-title.cc    { color: var(--cc);     background: var(--cc-light); }
.tbl-title.c     { color: var(--c);      background: var(--c-light);  }

table {
  width: 100%; border-collapse: collapse;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 0 0 var(--rs) var(--rs);
  overflow: hidden;
}
th {
  background: var(--surface2); font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .06em; color: var(--fg3);
  padding: 8px 12px; text-align: left;
}
td {
  padding: 11px 12px; font-size: 15px;
  border-top: 1px solid var(--border);
  font-variant-numeric: tabular-nums;
}
td:first-child  { font-weight: 700; font-size: 17px; width: 52px; }
td.qty-fondo    { color: var(--accent); }
td.qty-cc       { color: var(--cc); }
td.qty-c        { color: var(--c); }
tr:nth-child(even) td { background: var(--surface2); }

/* ── Texto copia ── */
.copy-box {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  padding: 14px;
  margin-bottom: 10px;
}
.copy-lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--fg3); margin-bottom: 8px; }
.copy-txt {
  font-family: 'Courier New', monospace;
  font-size: 12px; line-height: 1.65; color: var(--fg2);
  white-space: pre; overflow-x: auto;
  padding: 10px; background: var(--surface2);
  border-radius: var(--rs); margin-bottom: 10px;
  -webkit-overflow-scrolling: touch;
}
.btn-copy {
  width: 100%; padding: 13px;
  background: var(--surface2); color: var(--fg);
  border: 1.5px solid var(--border); border-radius: var(--rs);
  font-family: inherit; font-size: 14px; font-weight: 600;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: all .15s;
}
.btn-copy.ok { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }

/* ── Empty ── */
.empty { text-align: center; padding: 36px 16px; color: var(--fg3); font-size: 14px; }
.empty .ico { font-size: 40px; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="app-bar">
  <div class="app-bar-inner">
    <h1>Pedido Melamina</h1>
    <span class="step-badge" id="stepBadge">Paso 1 de 3</span>
  </div>
  <div class="progress"><div class="progress-bar" id="progBar" style="width:33%"></div></div>
</div>

<div class="main">

  <!-- PASO 1 -->
  <div class="step active" id="step1">
    <p class="step-title">Datos del pedido</p>
    <p class="step-sub">Referencia, grosor y color</p>

    <div class="field">
      <label class="lbl" for="referencia">Referencia cliente</label>
      <input type="text" id="referencia" placeholder="Nombre o código" autocomplete="off" autocapitalize="words" spellcheck="false">
    </div>

    <div class="field">
      <label class="lbl">Grosor</label>
      <div class="btn-grid btn-grid-3">
        <button class="sel-btn" data-g="16" onclick="selGrosor(16,this)">16<span class="sub">mm</span></button>
        <button class="sel-btn" data-g="18" onclick="selGrosor(18,this)">18<span class="sub">mm</span></button>
        <button class="sel-btn" data-g="19" onclick="selGrosor(19,this)">19<span class="sub">mm</span></button>
      </div>
      <div class="err" id="errGrosor">Selecciona el grosor</div>
    </div>

    <div class="field">
      <label class="lbl">Color melamina</label>
      <div class="btn-grid btn-grid-3">
        <button class="sel-btn color-btn" data-col="Gris plomo" onclick="selColor('Gris plomo',this)">Gris plomo</button>
        <button class="sel-btn color-btn" data-col="Blanco"     onclick="selColor('Blanco',this)">Blanco</button>
        <button class="sel-btn color-btn" data-col="Gris"       onclick="selColor('Gris',this)">Gris</button>
      </div>
      <div class="err" id="errColor">Selecciona el color</div>
    </div>

    <button class="btn-primary" onclick="goPaso2()">Siguiente → Cascos</button>
  </div>

  <!-- PASO 2 -->
  <div class="step" id="step2">
    <p class="step-title">Cascos</p>
    <p class="step-sub">Añade cada casco con su ancho y cajones</p>

    <div id="cascosList">
      <div class="empty"><div class="ico">📦</div>Sin cascos.<br>Pulsa el botón para añadir.</div>
    </div>

    <button class="btn-add" onclick="addCasco()"><span style="font-size:20px;line-height:1">＋</span> Añadir casco</button>
    <button class="btn-primary" onclick="goPaso3()">Generar pedido</button>
    <button class="btn-sec" onclick="ir(1)">← Volver</button>
  </div>

  <!-- PASO 3 -->
  <div class="step" id="step3">
    <p class="step-title">Pedido generado</p>
    <p class="step-sub">Revisa y comparte</p>

    <div id="resultContent"></div>

    <div class="copy-box">
      <div class="copy-lbl">Texto para copiar / enviar</div>
      <div class="copy-txt" id="txtCopia"></div>
      <button class="btn-copy" id="btnCopy" onclick="copiar()">📋 Copiar texto</button>
    </div>

    <button class="btn-sec" onclick="ir(2)">← Editar cascos</button>
    <button class="btn-sec" onclick="abrirPDF()" style="margin-top:8px">🖨️ Abrir para guardar PDF</button>
    <button class="btn-sec btn-danger-out" onclick="reset()" style="margin-top:8px">Nuevo pedido</button>
  </div>

</div>

<script>
// ── Constantes ──
const FONDO_OFFSET  = { 16: 10.7, 18: 11.1, 19: 11.3 };
const TRASERA_OFF   = 1.2;
const ALTURA_CC     = 18.2;
const ALTURA_C      = 6.9;
const FONDO_BASE    = 49.3;

// ── Estado ──
let grosor = null, colorMel = null;
let cascos = [], counter = 0;

// ── Utilidades ──
const fmt = v => v.toFixed(1).replace('.', ',');
const today = () => {
  const d = new Date();
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
};

// ── Navegación ──
function ir(n) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById('step' + n).classList.add('active');
  document.getElementById('stepBadge').textContent = `Paso ${n} de 3`;
  document.getElementById('progBar').style.width = (n / 3 * 100) + '%';
  window.scrollTo(0, 0);
}

// ── Selectores ──
function selGrosor(val, btn) {
  grosor = val;
  document.querySelectorAll('[data-g]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('errGrosor').classList.remove('on');
}

function selColor(val, btn) {
  colorMel = val;
  document.querySelectorAll('[data-col]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('errColor').classList.remove('on');
}

// ── Paso 1 → 2 ──
function goPaso2() {
  const ref = document.getElementById('referencia').value.trim();
  if (!ref) { document.getElementById('referencia').focus(); return; }
  if (!grosor)   { document.getElementById('errGrosor').classList.add('on'); return; }
  if (!colorMel) { document.getElementById('errColor').classList.add('on'); return; }
  ir(2);
}

// ── Cascos ──
function addCasco() {
  counter++;
  const id = counter;
  cascos.push({ id });
  const list = document.getElementById('cascosList');
  const empty = list.querySelector('.empty');
  if (empty) empty.remove();

  const card = document.createElement('div');
  card.className = 'casco-card';
  card.id = 'casco_' + id;
  card.innerHTML = `
    <div class="casco-head">
      <span class="casco-num">Casco ${cascos.length}</span>
      <button class="btn-rm" onclick="rmCasco(${id})">✕</button>
    </div>
    <div class="casco-row">
      <div>
        <label class="lbl" for="an_${id}">Ancho (cm)</label>
        <input type="number" id="an_${id}" placeholder="60" inputmode="decimal" min="1" step="0.1">
      </div>
      <div>
        <label class="lbl" for="cc_${id}"><span class="badge badge-cc">CC</span></label>
        <input type="number" id="cc_${id}" value="0" inputmode="numeric" min="0">
      </div>
      <div>
        <label class="lbl" for="cv_${id}"><span class="badge badge-c">C</span></label>
        <input type="number" id="cv_${id}" value="0" inputmode="numeric" min="0">
      </div>
    </div>`;
  list.appendChild(card);
  setTimeout(() => document.getElementById('an_' + id)?.focus(), 80);
}

function rmCasco(id) {
  cascos = cascos.filter(c => c.id !== id);
  document.getElementById('casco_' + id)?.remove();
  document.querySelectorAll('.casco-num').forEach((el, i) => { el.textContent = 'Casco ' + (i + 1); });
  if (cascos.length === 0) {
    document.getElementById('cascosList').innerHTML = '<div class="empty"><div class="ico">📦</div>Sin cascos.<br>Pulsa el botón para añadir.</div>';
  }
}

// ── Paso 2 → 3 ──
function goPaso3() {
  if (!cascos.length) { alert('Añade al menos un casco'); return; }
  for (const c of cascos) {
    if (!(parseFloat(document.getElementById('an_' + c.id)?.value) > 0)) {
      document.getElementById('an_' + c.id)?.focus(); return;
    }
  }
  buildResult();
  ir(3);
}

// ── Cálculos ──
function calcData() {
  const off = FONDO_OFFSET[grosor];
  return cascos.map(c => {
    const ancho  = parseFloat(document.getElementById('an_' + c.id)?.value) || 0;
    const cc     = parseInt(document.getElementById('cc_' + c.id)?.value)   || 0;
    const cv     = parseInt(document.getElementById('cv_' + c.id)?.value)   || 0;
    const fondo  = Math.round((ancho - off) * 10) / 10;
    const trasera = Math.round((fondo - TRASERA_OFF) * 10) / 10;
    return { ancho, cc, cv, fondo, trasera };
  }).filter(c => c.ancho > 0);
}

function agrupar(data) {
  const fondos = {}, trasCc = {}, trasC = {};
  data.forEach(c => {
    const qty = c.cc + c.cv;
    if (qty > 0)  fondos[c.fondo]   = (fondos[c.fondo]   || 0) + qty;
    if (c.cc > 0) trasCc[c.trasera] = (trasCc[c.trasera] || 0) + c.cc;
    if (c.cv > 0) trasC[c.trasera]  = (trasC[c.trasera]  || 0) + c.cv;
  });
  return { fondos, trasCc, trasC };
}

// ── Render resultado ──
function buildResult() {
  const ref = document.getElementById('referencia').value.trim();
  const col = colorMel;
  const data = calcData();
  const { fondos, trasCc, trasC } = agrupar(data);
  const sort = obj => Object.keys(obj).sort((a,b) => parseFloat(a) - parseFloat(b));

  const tblRows = (obj, cls) => sort(obj).map(k =>
    `<tr><td class="${cls}">${obj[k]}</td><td>${fmt(parseFloat(k))}</td><td>${fmt(cls === 'qty-fondo' ? FONDO_BASE : cls === 'qty-cc' ? ALTURA_CC : ALTURA_C)}</td></tr>`
  ).join('');

  let html = `
    <div class="pedido-meta">
      <div class="meta-row"><span class="meta-lbl">Referencia</span><span class="meta-val">${ref}</span></div>
      <div class="meta-row"><span class="meta-lbl">Fecha</span><span class="meta-val">${today()}</span></div>
      <div class="meta-row"><span class="meta-lbl">Color</span><span class="meta-val">${col}</span></div>
      <div class="meta-row"><span class="meta-lbl">Grosor</span><span class="meta-val">${grosor} mm</span></div>
    </div>
    <div class="tbl-section">
      <div class="tbl-title fondo">Fondos</div>
      <table><thead><tr><th>Cant.</th><th>Ancho (cm)</th><th>Fondo</th></tr></thead>
      <tbody>${sort(fondos).map(k=>`<tr><td class="qty-fondo">${fondos[k]}</td><td>${fmt(parseFloat(k))}</td><td>${fmt(FONDO_BASE)}</td></tr>`).join('')}</tbody></table>
    </div>`;

  if (sort(trasCc).length)
    html += `<div class="tbl-section"><div class="tbl-title cc">Traseras CC</div>
      <table><thead><tr><th>Cant.</th><th>Ancho (cm)</th><th>Altura</th></tr></thead>
      <tbody>${tblRows(trasCc,'qty-cc')}</tbody></table></div>`;

  if (sort(trasC).length)
    html += `<div class="tbl-section"><div class="tbl-title c">Traseras C</div>
      <table><thead><tr><th>Cant.</th><th>Ancho (cm)</th><th>Altura</th></tr></thead>
      <tbody>${tblRows(trasC,'qty-c')}</tbody></table></div>`;

  document.getElementById('resultContent').innerHTML = html;

  // Texto plano
  const ref2 = document.getElementById('referencia').value.trim();
  let txt = `PEDIDO MELAMINA DE CAJONES\n${'─'.repeat(28)}\n`;
  txt += `Ref.:   ${ref2}\nFecha:  ${today()}\nColor:  ${col}\nGrosor: ${grosor}mm\n\nFONDOS\n`;
  sort(fondos).forEach(k => { txt += `  ${fondos[k]}x  ${fmt(parseFloat(k))} cm  ×  ${fmt(FONDO_BASE)}\n`; });
  if (sort(trasCc).length) { txt += `\nTRASERAS CC\n`; sort(trasCc).forEach(k => { txt += `  ${trasCc[k]}x  ${fmt(parseFloat(k))} cm  ×  ${fmt(ALTURA_CC)}\n`; }); }
  if (sort(trasC).length)  { txt += `\nTRASERAS C\n`;  sort(trasC).forEach(k  => { txt += `${trasC[k]}x  ${fmt(parseFloat(k))} cm  ×  ${fmt(ALTURA_C)}\n`;  }); }
  document.getElementById('txtCopia').textContent = txt;
}

// ── Copiar ──
function copiar() {
  const txt = document.getElementById('txtCopia').textContent;
  const btn = document.getElementById('btnCopy');
  navigator.clipboard?.writeText(txt).then(() => {
    btn.textContent = '✓ Copiado'; btn.classList.add('ok');
    setTimeout(() => { btn.innerHTML = '📋 Copiar texto'; btn.classList.remove('ok'); }, 2500);
  }).catch(() => {
    const r = document.createRange();
    r.selectNodeContents(document.getElementById('txtCopia'));
    getSelection().removeAllRanges(); getSelection().addRange(r);
    btn.textContent = 'Selecciona y copia'; btn.classList.add('ok');
  });
}

// ── PDF ──

  }

  const html = `<!doctype html><html lang="es"><head>

// ── Reset ──
function reset() {
  grosor = null; colorMel = null; cascos = []; counter = 0;
  document.getElementById('referencia').value = '';
  document.querySelectorAll('[data-g],[data-col]').forEach(b => b.classList.remove('active'));

  ir(1);
}

if ('serviceWorker' in navigator) {

      );

  `;
